name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup nix
        uses: ./.github/actions/setup-nix

      # Best-effort: keeps CI green before the dedicated cache exists, and
      # activates fully (pull + auto-push) once takeokunn-readthezero is created.
      - name: Setup Cachix
        continue-on-error: true
        uses: cachix/cachix-action@v17
        with:
          name: takeokunn-readthezero
          extraPullNames: takeokunn-nixos-configuration
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run all checks
        run: nix flake check --print-build-logs

      - name: Build site
        run: |
          nix build .#site
          cp -rL result site

      - name: Upload pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
